<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nav Unit – Réglages</title><link rel="stylesheet" href="/demo.css"><script defer src="/demo.js"></script></head><body><header><strong>NAV UNIT <small>V2.4</small></strong><nav><a href="/index.html">Accueil</a><a href="/settings.html" aria-current="page">Réglages</a></nav></header><main><section class="intro"><h1>Dimensions du navigateur</h1><p>Modifie le container HTML. Les réglages sont conservés dans ce navigateur, pour cette adresse locale.</p></section><form id="settings" class="panel"><label for="width">Largeur (px)</label><input id="width" type="number" min="320" max="1920" required value="1280"><label for="height">Hauteur (px)</label><input id="height" type="number" min="240" max="1200" required value="650"><label class="check"><input id="full" type="checkbox"> Largeur automatique (100 %)</label><div class="actions"><button type="submit">Enregistrer</button><button type="button" class="secondary" id="reset">Réinitialiser</button><a class="button secondary" href="/index.html">Retour au navigateur</a></div><output id="message" role="status"></output></form><h2>Aperçu du container</h2><div id="preview-area"><div id="preview"><span id="preview-label"></span></div></div></main></body></html>
